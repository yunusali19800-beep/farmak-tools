<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Журнал сканирований · farmak-tools</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f6fb;color:#1c2b52}
  main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
  h1{font-size:20px;margin:0 0 14px}
  h2{font-size:15px;margin:22px 0 8px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input{flex:1;min-width:200px;padding:10px 12px;border:1px solid #c5cde0;border-radius:8px;font-size:15px}
  button{padding:10px 16px;border:0;border-radius:8px;background:#1c2b52;color:#fff;font-size:15px;cursor:pointer}
  button.alt{background:#fff;color:#1c2b52;border:1px solid #1c2b52}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;font-size:14px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #e6eaf3}
  th{background:#e9eef8;font-weight:600}
  td.n,th.n{text-align:right}
  .msg{margin:10px 0;color:#a33}
  .tot{font-size:15px;margin:14px 0 0}
  [hidden]{display:none}
</style>
</head>
<body>
<main>
  <h1>Журнал сканирований QR-инструментов</h1>
  <div class="row">
    <input id="key" type="password" placeholder="Ключ руководителя (ADMIN_KEY)" autocomplete="current-password">
    <button id="show">Показать</button>
    <button id="csv" class="alt">Скачать CSV</button>
  </div>
  <div class="msg" id="msg" hidden></div>
  <div id="out" hidden>
    <p class="tot" id="tot"></p>
    <h2>По инструментам</h2><table id="t-tool"></table>
    <h2>По дням (последние 30)</h2><table id="t-day"></table>
    <h2>По регионам (первые 20)</h2><table id="t-region"></table>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const key = () => $('key').value.trim();

function fail(text) { $('msg').textContent = text; $('msg').hidden = false; }

async function call(query) {
  $('msg').hidden = true;
  if (!key()) { fail('Введите ключ.'); return null; }
  const r = await fetch('/api/scans' + query, { headers: { Authorization: 'Bearer ' + key() } });
  if (!r.ok) {
    let m = 'Ошибка ' + r.status;
    try { m = (await r.json()).error || m; } catch (e) {}
    fail(m);
    return null;
  }
  return r;
}

function fill(id, head, rows) {
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  $(id).innerHTML =
    '<tr>' + head.map((h, i) => `<th class="${i ? 'n' : ''}">${h}</th>`).join('') + '</tr>' +
    rows.map((r) => '<tr>' + r.map((v, i) => `<td class="${i ? 'n' : ''}">${esc(v)}</td>`).join('') + '</tr>').join('');
}

$('show').onclick = async () => {
  const r = await call('');
  if (!r) return;
  const d = await r.json();
  $('tot').textContent = `Всего сканирований: ${d.total}. Разных устройств: ${d.devices}.`;
  fill('t-tool', ['Инструмент', 'Сканирований', 'Устройств'], d.byTool.map((x) => [x.tool, x.n, x.devices]));
  fill('t-day', ['День', 'Сканирований'], d.byDay.map((x) => [x.day, x.n]));
  fill('t-region', ['Регион', 'Сканирований'], d.byRegion.map((x) => [x.region, x.n]));
  $('out').hidden = false;
};

$('csv').onclick = async () => {
  const r = await call('?format=csv');
  if (!r) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(await r.blob());
  a.download = 'scan-log.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
