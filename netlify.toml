# Netlify больше не хостит инструменты: сайт переехал на Cloudflare.
# Этот файл оставляет farmak-tools.netlify.app живым как переадресацию,
# чтобы напечатанные QR-коды продолжали открываться. Путь и параметры сохраняются.
[build]
  command = "echo redirect-only"
  publish = "public"

[[redirects]]
  from = "/*"
  to = "https://farmak-tools.farmak-nevro.workers.dev/:splat"
  status = 308
  force = true
