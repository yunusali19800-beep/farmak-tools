<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>Инструкция · Farmak</title>
<style>
  :root{--bg:#0D59B1;--ink:#0E2647;--soft:#44618A;--card:#fff;--line:#D3E1F0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#eef3f9;color:var(--ink);-webkit-font-smoothing:antialiased}
  .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 14px;background:var(--bg);color:#fff;box-shadow:0 2px 10px rgba(6,32,66,.25)}
  .bar .ttl{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar a{flex:0 0 auto;text-decoration:none;font-size:13px;font-weight:700;color:var(--bg);
    background:#fff;padding:8px 12px;border-radius:9px}
  .doc{max-width:820px;margin:0 auto;padding:14px 10px 40px}
  canvas{width:100%;height:auto;display:block;margin:0 auto 12px;background:#fff;
    border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 14px rgba(6,32,66,.10)}
  .msg{max-width:560px;margin:40px auto;padding:22px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;text-align:center;color:var(--soft);font-size:15px;line-height:1.5}
  .msg a{display:inline-block;margin-top:14px;text-decoration:none;font-weight:700;color:#fff;
    background:var(--bg);padding:12px 20px;border-radius:11px}
  .spin{margin:50px auto;text-align:center;color:var(--soft);font-size:14px}
</style>
</head>
<body>
  <div class="bar">
    <div class="ttl" id="ttl">Инструкция</div>
    <a id="dl" href="#" download>Скачать PDF</a>
  </div>
  <div class="doc" id="doc"><div class="spin" id="spin">Загрузка инструкции…</div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
  (function(){
    var MAP = {
      flertis:  {file:"flertis_instrukciya.pdf",  name:"Инструкция · Флертис"},
      gliyaton: {file:"gliyaton_instrukciya.pdf", name:"Инструкция · Глиятон"},
      lira:     {file:"lira_instrukciya.pdf",      name:"Инструкция · Лира"}
    };
    var key = (new URLSearchParams(location.search).get("f")||"flertis").toLowerCase();
    var meta = MAP[key] || MAP.flertis;
    var doc = document.getElementById("doc");
    var spin = document.getElementById("spin");
    document.getElementById("ttl").textContent = meta.name;
    document.getElementById("dl").href = meta.file;

    function fallback(){
      doc.innerHTML = '<div class="msg">Не удалось отобразить инструкцию во встроенном просмотре.'
        + '<br><a href="'+meta.file+'">Открыть PDF напрямую</a></div>';
    }
    if(!window.pdfjsLib){ fallback(); return; }
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    pdfjsLib.getDocument(meta.file).promise.then(function(pdf){
      if(spin) spin.remove();
      var scale = Math.min(2, (window.devicePixelRatio||1) * 1.3);
      var chain = Promise.resolve();
      for(var n=1; n<=pdf.numPages; n++){
        (function(pn){
          chain = chain.then(function(){
            return pdf.getPage(pn).then(function(page){
              var vp = page.getViewport({scale:scale});
              var cv = document.createElement("canvas");
              cv.width = vp.width; cv.height = vp.height;
              doc.appendChild(cv);
              return page.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise;
            });
          });
        })(n);
      }
      return chain;
    }).catch(fallback);
  })();
  </script>
</body>
</html>
