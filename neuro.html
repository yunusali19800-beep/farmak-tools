<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1A2E5A">
<title>Farmak · неврология</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#eaf0fb;
    background:radial-gradient(800px 460px at 50% -6%, #24479a 0%, transparent 60%),
      linear-gradient(170deg,#0b1a3d 0%,#1A2E5A 55%,#0a1530 100%);
    min-height:100dvh;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;
  }
  .wrap{max-width:460px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:26px 20px calc(26px + env(safe-area-inset-bottom));gap:22px;}
  .head{text-align:center;}
  .head .f{font-size:13px;letter-spacing:5px;opacity:.85;text-transform:uppercase;}
  .head h1{font-size:23px;font-weight:800;margin-top:8px;line-height:1.3;}
  .head p{font-size:14px;opacity:.8;margin-top:8px;}
  .cards{display:flex;flex-direction:column;gap:14px;}
  .card{display:flex;align-items:center;gap:16px;text-decoration:none;color:#fff;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:20px 18px;
    transition:transform .1s, background .15s;box-shadow:0 6px 20px rgba(0,0,0,.18);}
  .card:active{transform:scale(.98);}
  .card .ic{width:56px;height:56px;flex:0 0 auto;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;}
  .card.tool .ic{background:linear-gradient(180deg,#2f6fd6,#1b4a99);}
  .card.game .ic{background:linear-gradient(180deg,#E8B84B,#c9962a);}
  .card .tx{flex:1;}
  .card .tt{font-size:17px;font-weight:800;}
  .card .ds{font-size:13px;opacity:.8;margin-top:3px;line-height:1.35;}
  .card .go{font-size:22px;opacity:.6;}
  .foot{text-align:center;font-size:11px;opacity:.55;line-height:1.5;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="f">Farmak</div>
      <h1>Неврология: инструмент и разминка</h1>
      <p>Выберите, что открыть</p>
    </div>
    <div class="cards">
      <!-- ↓ ПОДСТАВЬ нужный клинический инструмент под конкретный QR -->
      <a class="card tool" href="vosstanovlenie.html">
        <div class="ic">🩺</div>
        <div class="tx"><div class="tt">Клинический инструмент</div><div class="ds">Материал для работы: показания, схемы, данные</div></div>
        <div class="go">→</div>
      </a>
      <a class="card game" href="neuroigra.html">
        <div class="ic">🧠</div>
        <div class="tx"><div class="tt">Разминка</div><div class="ds">Нейро-викторина на перерыв · 15 вопросов</div></div>
        <div class="go">→</div>
      </a>
    </div>
    <div class="foot">Для медицинских специалистов. Не является рекламой лекарственных средств.</div>
  </div>
</body>
</html>
